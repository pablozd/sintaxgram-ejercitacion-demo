<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gramática B · Ejercitación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap">
<style>
/* Layout: columna única de lectura; editor y diagnóstico apilados, navegación de ítems como fila de chips. */
:root {
  /* paleta de pablozd.ar (tema al-folio: --global-*) */
  --bg: #ffffff;
  --surface: #ffffff;
  --ink: #000000;
  --muted: #828282;
  --line: #e6e6e6;            /* divider rgba(0,0,0,.1) */
  --accent: #0f6cbf;          /* theme-color */
  --accent-soft: #e7f0f9;
  --ok: #359469;
  --warn: #b29400;
  --bad: #cc0000;
  --code-bg: #f3f8fc;         /* code-bg rgba(15,108,191,.05) */
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "DejaVu Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1c1d; --surface: #212529; --ink: #e8e8e8; --muted: #828282; --line: #424246;
    --accent: #2698ba; --accent-soft: #1d3540; --ok: #42b983; --warn: #e7c000; --bad: #ff6b6b;
    --code-bg: #2c3237; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1c1d; --surface: #212529; --ink: #e8e8e8; --muted: #828282; --line: #424246;
  --accent: #2698ba; --accent-soft: #1d3540; --ok: #42b983; --warn: #e7c000; --bad: #ff6b6b;
  --code-bg: #2c3237; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--sans);
}
.wrap {
  max-width: 1280px; margin: 0 auto;
  padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
h1, h2 { font-family: var(--serif); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; line-height: 1.2; }
h2 { font-size: 1.15rem; }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.head { display: grid; gap: 6px; border-bottom: 2px solid var(--accent); padding-bottom: 14px; }
.head-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .78rem; padding: 2px 10px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); background: var(--surface);
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.chip.on .dot { background: var(--ok); }
.autores { font-size: .9rem; color: var(--muted); }
.progress { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; }

/* paño lateral: guías y ejercicios desplegables */
.layout { display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); gap: 24px; align-items: start; }
.side {
  position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto;
  display: grid; gap: 6px; padding-right: 4px; overscroll-behavior: contain;
}
.side details { border-radius: 6px; }
.side summary {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  cursor: pointer; list-style: none; padding: 8px 10px; border-radius: 6px;
}
.side summary::-webkit-details-marker { display: none; }
.side summary::before {
  content: ""; flex: none; width: 6px; height: 6px; margin: .45em 2px 0 0; align-self: flex-start;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg);
  transition: transform .15s ease;
}
.side details[open] > summary::before { transform: rotate(45deg); }
.side summary:hover { background: var(--code-bg); }
.side summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.side .g { border: 1px solid var(--line); background: var(--surface); }
.side .g > summary { font: 600 .95rem var(--sans); }
.side .g.actual > summary { color: var(--accent); }
.side .g-t, .side .e-t { flex: 1; min-width: 0; }
.side .cnt { font: 500 .72rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.side .exs { display: grid; gap: 2px; padding: 0 6px 8px 14px; }
.side .e > summary { font-size: .85rem; padding: 6px 8px; }
.side .e.actual > summary { font-weight: 600; }
.items { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 8px 10px 22px; }
.items button {
  font: 600 .78rem var(--mono); min-width: 34px; padding: 4px 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 5px;
  font-variant-numeric: tabular-nums;
}
.items button:hover { border-color: var(--accent); }
.items button[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.items button.ok { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); }
.items button.partial { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); }
.items button.bad { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.side-toggle { display: none; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; max-height: none; overflow: visible; padding-right: 0; }
  /* en pantallas angostas el índice se pliega en un botón para no empujar el ejercicio hacia abajo */
  .side-toggle {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px; width: 100%;
    font: 600 .9rem var(--sans); text-align: left; cursor: pointer; padding: 10px 12px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .side-toggle .cnt { font-weight: 500; }
  .side:not(.abierto) > details { display: none; }
}
@media (prefers-reduced-motion: reduce) { .side summary::before { transition: none; } }

/* ítem */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.consigna { color: var(--muted); font-size: .95rem; max-width: 65ch; }
.oracion { font-family: var(--serif); font-size: 1.35rem; line-height: 1.35; }
.oracion .n { color: var(--muted); font-family: var(--mono); font-size: .9rem; margin-right: 8px; }
.nota { font-size: .82rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }

.toolbar {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr));
  gap: 8px 14px; padding: 10px 12px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px;
}
.tb-group { display: grid; gap: 4px; align-content: start; min-width: 0; }
.tb-cap { font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tb-btns { display: flex; flex-wrap: wrap; gap: 4px; }
.toolbar button {
  font: 600 .78rem var(--mono); padding: 4px 8px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.toolbar button.sup { color: var(--accent); }
textarea {
  width: 100%; min-height: 96px; resize: vertical; padding: 10px 12px;
  font: .95rem/1.5 var(--mono); color: var(--ink); background: var(--code-bg);
  border: 1px solid var(--line); border-radius: 6px;
}
textarea:focus, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { font-size: .8rem; color: var(--muted); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  font: 600 .9rem var(--sans); padding: 8px 16px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--surface);
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
a.btn { text-decoration: none; display: inline-block; }

/* pregunta de clasificación */
fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 0; }
legend { font-weight: 600; font-size: .9rem; padding: 0 4px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .92rem; }
.opts label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

/* vista previa del análisis (aproximada; el dibujo canónico es sintaxgram) */
.preview { overflow-x: auto; padding: 12px 4px 6px; border-top: 1px dashed var(--line); }
.preview .err { color: var(--bad); font-size: .85rem; }
/*
 * Medidas compartidas: --word es el alto de la línea de palabras; --head es lo que ocupa
 * una etiqueta superior (rótulo + corchete), para alinear las palabras de los hermanos.
 */
.tree {
  --word: 1.5em; --lab: .9rem; --brk: 7px; --stroke: 2px;
  --head: calc(var(--lab) + var(--brk) + 3px);
  display: inline-flex; align-items: flex-start; gap: .3em;
  font-family: var(--serif); font-size: 1.25rem; white-space: nowrap; padding-bottom: 4px;
}
.c { display: inline-flex; flex-direction: column; align-items: stretch; }
.c > .body { display: inline-flex; align-items: flex-start; gap: .3em; }
.c > .lab {
  font: 500 .62rem/var(--lab) var(--sans); letter-spacing: .08em; text-align: center;
  color: var(--ink); height: var(--lab);
}
.w, .br { line-height: var(--word); }
.br { color: var(--ink); }
.lines { display: grid; gap: 18px; justify-items: start; }
/* constituyente cortado por un salto de línea: abierto del lado del corte */
.c.sup.cl > .brk { border-left: 0; }
.c.sup.cr > .brk { border-right: 0; }
.c.box.cl > .body::after { border-left: 0; }
.c.box.cr > .body::after { border-right: 0; }

/* superior: rótulo, línea con patas cortas hacia abajo, palabras */
.c.sup > .brk {
  height: var(--brk); margin-bottom: 3px;
  border: var(--stroke) solid var(--ink); border-bottom: 0;
}
.c.sup > .body { padding: 0 .15em; }

/* caja: patas desde debajo de las palabras, línea por debajo de las etiquetas internas, rótulo abajo */
.c.box > .body { position: relative; padding: 0 .2em 5px; }
.c.box > .body::after {
  content: ""; position: absolute; inset: calc(var(--head) * var(--d, 0) + var(--word) - 2px) 0 0 0;
  border: var(--stroke) solid var(--ink); border-top: 0; pointer-events: none;
}
.c.box > .lab { margin-top: 3px; }

/* etiqueta simple: rótulo bajo la palabra */
.c.tag > .lab { margin-top: 1px; }

/* corchetes con etiqueta al costado: [ … ]OS */
.c.sqc { display: inline-flex; flex-direction: row; align-items: flex-start; gap: .3em; }
.sqlab { font: 500 .62rem var(--sans); letter-spacing: .08em; padding-top: 1.2em; margin-left: -.25em; }

/* diagnóstico */
.result { display: grid; gap: 10px; }
.score { display: flex; align-items: baseline; gap: 10px; }
.score b { font: 600 1.6rem var(--serif); font-variant-numeric: tabular-nums; }
.score.ok b { color: var(--ok); }
.score.bad b { color: var(--bad); }
.errs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.errs li {
  display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
  padding: 8px 10px; border-radius: 6px; background: var(--code-bg); border-left: 4px solid var(--muted);
  font-size: .93rem;
}
.errs li.alta { border-left-color: var(--bad); }
.errs li.media { border-left-color: var(--warn); }
.errs li.obs { border-left-color: var(--line); color: var(--muted); }
.errs .code { font: 600 .7rem var(--mono); color: var(--muted); padding-top: 3px; min-width: 70px; }
.more { background: none; border: 0; color: var(--accent); cursor: pointer; font: 600 .85rem var(--sans); padding: 0; justify-self: start; }
.clave { font: .85rem var(--mono); background: var(--code-bg); padding: 8px 10px; border-radius: 6px; overflow-x: auto; white-space: pre; }
.toast { font-size: .85rem; color: var(--ok); }

@media (prefers-reduced-motion: no-preference) {
  .result { animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: .4; transform: translateY(2px); } to { opacity: 1; transform: none; } }
}
@media (max-width: 520px) {
  .oracion { font-size: 1.15rem; }
  .errs li { grid-template-columns: 1fr; gap: 2px; }
}

</style>
</head>

    var donde = (GUIAS.length > 1 ? x.g.titulo + ' · ' : '') + x.ex.titulo.replace(/^Ejercicio (\d+)\..*$/, 'Ej. $1') + ' · (' + x.it.num + ')';
    return '<aside class="side' + (indiceMovil ? ' abierto' : '') + '" aria-label="Guías y ejercicios">' +
      '<button type="button" class="side-toggle" aria-expanded="' + indiceMovil + '"><span>' + esc(donde) + '</span>' +
      '<span class="cnt">' + (indiceMovil ? 'cerrar' : 'cambiar') + '</span></button>' + GUIAS.map(function (g, gi) {
      var todos = [];
      g.ejercicios.forEach(function (ex) { todos = todos.concat(ex.items); });
      var exs = g.ejercicios.map(function (ex, ei) {
        var k = 'e' + gi + '-' + ei;
        var chips = ex.items.map(function (it) {
          var r = state.r[it.id], cls = '';
          if (r && r.s != null) cls = r.s >= 0.999 ? 'ok' : (r.s >= 0.6 ? 'partial' : 'bad');
          var h = '<button class="' + cls + '" data-i="' + i + '"' + (i === cur ? ' aria-current="true"' : '') +
            ' title="' + esc(it.oracion) + '">' + it.num + '</button>';
          i++;
          return h;
        }).join('');
        return '<details class="e' + (ex === x.ex ? ' actual' : '') + '" data-k="' + k + '"' + (abiertos[k] ? ' open' : '') + '>' +
          '<summary><span class="e-t">' + esc(ex.titulo) + '</span><span class="cnt">' + hechasDe(ex.items) + '/' + ex.items.length + '</span></summary>' +
          '<div class="items">' + chips + '</div></details>';
      }).join('');
      var kg = 'g' + gi;
      return '<details class="g' + (gi === x.gi ? ' actual' : '') + '" data-k="' + kg + '"' + (abiertos[kg] ? ' open' : '') + '>' +
        '<summary><span class="g-t">' + esc(g.titulo) + '</span><span class="cnt g-p">' + hechasDe(todos) + '/' + todos.length + '</span></summary>' +
        '<div class="exs">' + exs + '</div></details>';
    }).join('') + '</aside>';
  }

  function toolbarHTML() {
    var grupos = TOOLBAR.map(function (grp, gi) {
      var btns = grp.l.map(function (l) {
        var sup = SUP.indexOf(L.canon(l)) >= 0;
        return '<button type="button" class="' + (sup ? 'sup' : '') + '" data-l="' + l + '" title="' +
          esc(L.nombre(l) + (/\*$/.test(l) ? ' · caja' : (l === 'OS' || l === 'OC' ? ' · corchetes: [ … ]' + l + ' (optativo)' : ''))) + '">' + l + '</button>';
      }).join('');
      if (gi === 0) btns += '<button type="button" data-l="\\0" title="Elemento nulo (sujeto tácito)">∅</button>' +
        '<button type="button" data-l="\\\\" title="Salto de línea en el dibujo (\\\\)">↵</button>';
      return '<div class="tb-group" role="group" aria-label="' + esc(grp.g) + '"><span class="tb-cap">' + esc(grp.g) + '</span>' +
        '<div class="tb-btns">' + btns + '</div></div>';
    }).join('');
    return '<div class="toolbar" role="toolbar" aria-label="Etiquetas">' + grupos + '</div>';
  }

  function preguntaHTML(q, elegidas) {
    if (!q) return '';
    var type = q.multiple ? 'checkbox' : 'radio';
    return '<fieldset><legend>' + esc(q.texto) + (q.multiple ? ' (puede haber más de una)' : '') + '</legend><div class="opts">' +
      q.opciones.map(function (o, k) {
        return '<label><input type="' + type + '" name="q" id="q' + k + '" value="' + esc(o) + '"' +
          (elegidas.indexOf(o) >= 0 ? ' checked' : '') + '> ' + esc(o) + '</label>';
      }).join('') + '</div></fieldset>';
  }

  function wrap(ta, label) {
    var s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
    if (label === '\\0') {
      ta.value = v.slice(0, s) + '\\0' + v.slice(e);
      ta.setSelectionRange(s + 2, s + 2);
    } else if (label === 'OS' || label === 'OC') {
      // La oración incluida se marca con corchetes y la etiqueta al costado: [ … ]OS
      var selo = v.slice(s, e).replace(/^\s+|\s+$/g, ''), leado = v.slice(s, e).match(/^\s*/)[0];
      var outo = leado + '[ ' + selo + ' ]' + label;
      ta.value = v.slice(0, s) + outo + v.slice(e);
      if (s === e) ta.setSelectionRange(s + leado.length + 2, s + leado.length + 2);
      else ta.setSelectionRange(s + leado.length, s + outo.length);
    } else if (label === '\\\\') {
      ta.value = v.slice(0, s) + ' \\\\ ' + v.slice(e);
      ta.setSelectionRange(s + 4, s + 4);
    } else if (s === e) {
      ta.value = v.slice(0, s) + label + '{}' + v.slice(e);
      ta.setSelectionRange(s + label.length + 1, s + label.length + 1);
    } else {
      var sel = v.slice(s, e).replace(/^\s+|\s+$/g, '');
      var lead = v.slice(s, e).match(/^\s*/)[0];
      var out = lead + label + '{' + sel + '}';
      ta.value = v.slice(0, s) + out + v.slice(e);
      ta.setSelectionRange(s + lead.length, s + out.length);
    }
    ta.focus();
    ta.dispatchEvent(new Event('input'));
  }

  // ---------- corrección ----------
  function corregir() {
    var x = items[cur], it = x.it, ex = x.ex;
    var conAnalisis = !!(it.claves && it.claves.length);
    var src = conAnalisis ? $('#src').value : '';
    var elegidas = Array.prototype.map.call(document.querySelectorAll('input[name="q"]:checked'), function (i) { return i.value; });
    var res = evaluarItem(it, ex, src, elegidas, x.g);
    var prev = state.r[it.id] || {};

    // Estado compacto: respuesta, opciones (índices), puntaje e intentos. Nada de comentarios.
    var rec = { s: res.s, n: (prev.n || 0) + 1 };
    if (conAnalisis) rec.a = src;
    if (it.pregunta) rec.q = qToIdx(it.pregunta, elegidas);
    state.r[it.id] = rec;

    LMS.interaction(it.id, res.resumen, res.correct, 1);
    sync();
    showAll = false;
    render();
  }

  // "2 errores, 1 omisión"
  function resumenTipos(errs) {
    var c = {};
    errs.forEach(function (e) { var t = e.tipo || 'error'; c[t] = (c[t] || 0) + 1; });
    var pl = { 'error': 'errores', 'imprecisión': 'imprecisiones', 'omisión': 'omisiones' };
    return ['error', 'imprecisión', 'omisión'].filter(function (t) { return c[t]; })
      .map(function (t) { return c[t] + ' ' + (c[t] === 1 ? t : pl[t]); }).join(', ');
  }

  function showResult(last) {
    var x = items[cur], it = x.it;
    var n = (state.r[it.id] || {}).n || 0;
    var errs = last.errors || [], obs = last.obs || [];
    var vis = showAll ? errs : errs.slice(0, MAX_VISIBLES);
    var pct = Math.round(last.s * 100);
    var html = '<div class="result">' +
      '<div class="score ' + (last.correct ? 'ok' : 'bad') + '"><b>' + pct + '</b><span>/100 · ' +
      (last.correct ? 'Correcto.' : resumenTipos(errs) + ' · intento ' + n) + '</span></div>';
    if (vis.length) {
      html += '<ul class="errs">' + vis.map(function (e) {
        return '<li class="' + e.severity + '"><span class="code">' + esc(e.tipo || 'error') + '</span><span>' + esc(e.msg) + '</span></li>';
      }).join('') + '</ul>';
    }
    if (errs.length > MAX_VISIBLES) {
      html += '<button class="more" id="more">' + (showAll ? 'Mostrar sólo los más importantes' : 'Ver los ' + errs.length + ' comentarios') + '</button>';
    }
    if (obs.length) {
      html += '<ul class="errs">' + obs.map(function (o) { return '<li class="obs"><span class="code">' + esc(o.tipo || 'observación') + '</span><span>' + esc(o.msg) + '</span></li>'; }).join('') + '</ul>';
    }
    var tras = cfg(x.g, 'mostrarClaveTras', 0);
    if (!last.correct && tras && n >= tras && it.claves && it.claves.length) {
      html += '<details><summary>Ver clave</summary><div class="clave">' + it.claves.map(esc).join('\n') + '</div></details>';
    }
    html += '</div>';
    $('#resultado').innerHTML = html;
    var m = $('#more');
    if (m) m.addEventListener('click', function () { showAll = !showAll; showResult(last); });
  }

  render();
})();

</script>
</body>
</html>
